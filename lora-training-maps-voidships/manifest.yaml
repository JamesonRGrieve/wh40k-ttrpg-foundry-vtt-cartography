# Voidship deckmap LoRA — corpus generation manifest.
#
# Third LoRA in the campaign training set. Trigger word:
# `dh_voidship_map`. Trains the model to render top-down battlemap-
# format Imperial voidship deck plans with bare interior architecture
# (rooms ready for stamp population in a Foundry VTT map editor).
#
# Anchor prompt is the operator-validated "attempt 3" style. Every
# generation passes the matching `_references/style_reference_attempt3.png`
# as a style anchor so the hull rendering / lighting / paneling stays
# consistent with what the operator has already approved.
#
# Architecture — same matrix-sampling shape as the portrait LoRA:
#   - categories      = ship classes (small freighter, frigate, etc.)
#   - archetypes      = deck/layout variants WITHIN that class
#   - hull_states     = pristine / weathered / battle-damaged / derelict
#   - lightings       = lumen-strip / red-emergency / sodium / cold-blue
#   - Round-robin sampling so every archetype gets a unique
#     (hull_state, lighting) pair.
#
# Caption format:
#   dh_voidship_map, top-down battlemap of {class}, {deck/layout
#   variant}, {hull_state}, {lighting}, Imperial gothic hull plating
#   visible, empty interior architecture, Foundry VTT compatible
#
# This manifest is PREPARED but the generator has NOT BEEN RUN. The
# operator wants to validate prompts in the Gemini web chat before
# committing API spend (currently ~$4 left of the $20 envelope).

defaults:
  # No style reference — text-only generation. We are creating LoRA
  # training source material across visually-distinct ship classes,
  # not refining an existing aesthetic. A single shared style anchor
  # collapsed all classes into the same hull silhouette in the
  # 2026-05-08 smoke test (yacht/frigate/destroyer rendered with
  # near-identical interiors).
  style_reference: null
  composition: >-
    Top-down orthographic battlemap. The hull occupies the full image
    with the ship's long axis horizontal (bow at the left, stern at
    the right). Outside the hull is flat black void. The aspect ratio
    of the image matches the aspect ratio of the ship class — DO NOT
    crop to a square if the ship is long.
  hull_clause: >-
    Imperial gothic painted-metal hull plating viewed from directly
    above, with rivets, panel seams, weathered paint, and surface grime.
    Painterly oil-painting treatment, dark grimdark palette, visible
    brushwork on the plating
  empty_floors_clause: >-
    Empty interior rooms — no furniture, no crates, no consoles, no
    bunks, no equipment, no debris, no NPCs. The empty rooms will be
    filled with stamps in a Foundry VTT map editor later. Walls,
    doorways, and architectural fixtures only
  lighting_clause: "Interior passively lit by unseen lumen strips"
  exclusions: "No text, no compass, no scale, no labels, no legend"
  caption_trailer: >-
    top-down battlemap, Imperial voidship, empty interior architecture,
    Foundry VTT base map

# Two silhouette families. Imperial voidships overwhelmingly share the
# canonical gothic cathedral-prow profile from frigate through
# battleship: long spinal hull, pointed gothic forward ram-prow,
# swept-back stern dominated by an engine block, port/starboard
# sponsons. They differ in SCALE and ORNAMENTATION, not silhouette.
# The genuinely distinct family is the short-range "micro-ship":
# stubby boxy utility vessels (Arvus Lighter, the Errant Vector)
# with no gothic prow — these are the small workhorses that ferry
# cargo and crew within a system or to/from larger ships.
silhouette_families:
  gothic_voidship: >-
    Canonical Imperial gothic voidship profile in top-down: long
    spinal hull, pointed forward ram-prow tapering to a sharp gothic
    point, swept-back stern dominated by a heavy engine block, port
    and starboard sponsons protruding from the midsection. Roughly
    3:1 to 4:1 length-to-beam aspect ratio. Heraldic ornamentation
    along the dorsal spine and prow. Imagine a cathedral hammered
    into a lance, viewed from above
  micro_ship: >-
    Short-range Imperial micro-ship profile in top-down: compact
    boxy utilitarian hull with no gothic prow. Roughly 1.5:1 to 2:1
    length-to-beam aspect ratio. Slab-sided plating, small angular
    forward cockpit bubble, flat stern with a single engine cluster.
    Working-class void vessel, not a warship — Arvus-Lighter family.
    Stubby, blocky, purpose-built for system-internal hauls

# Per-category silhouette assignment + scale/ornamentation modifier.
# `family` selects the base silhouette; `modifier` overrides scale,
# ornamentation, sponson detail, and visible loadout to differentiate
# classes that share a family.
silhouettes:
  map-freighter-small:
    family: micro_ship
    modifier: >-
      Smallest scale of the family. Roughly the footprint of an Arvus
      Lighter. Single cockpit, one or two interior compartments, one
      cargo bay. Plain civilian hull plating, no military sponsons,
      no heraldic ornamentation
  map-freighter-medium:
    family: micro_ship
    modifier: >-
      Larger scale than a small freighter — an enlarged civilian
      hauler in the micro-ship family. Length increased to roughly
      2:1 aspect, beam widened to accommodate multiple internal
      compartments. Plain plating with light bracing along the spine.
      Still no military sponsons or gothic prow. Civilian merchantman
  map-frigate-escort:
    family: gothic_voidship
    modifier: >-
      Smallest scale of the gothic voidship family. Roughly Sword-class
      frigate proportions — relatively narrow beam, with a row of
      LATERAL BROADSIDE GUN BATTERIES running along both the port and
      starboard flanks of the midsection. The guns point outward to
      port and starboard (lateral broadsides), NOT forward — Imperial
      Navy ships fight broadside-on, they do not have forward-facing
      pursuit gun arrays. The bow is a simple armored gothic prow with
      heraldry, NO forward turrets or pursuit batteries. Military hull
      plating with regimental Imperial Navy heraldry along the prow
      and dorsal spine. Lethal-looking warship profile, not a freighter
  map-destroyer-light:
    family: gothic_voidship
    modifier: >-
      Slightly larger and heavier than a frigate. Roughly Cobra-class
      destroyer proportions. Broader beam, with an even longer row of
      LATERAL BROADSIDE GUN BATTERIES along port and starboard flanks
      — the broadsides are the primary armament, pointing outward to
      port and starboard, NOT forward. The gothic prow is a heavy
      armored ram, NO forward gun array. Larger stern engine block.
      Visibly meaner than a frigate. Heraldic Imperial Navy ornamentation
  map-transport-bulk:
    family: gothic_voidship
    modifier: >-
      Mid-scale gothic voidship adapted for bulk cargo. Beam widened
      relative to a warship of equivalent length to accommodate an
      enormous central cargo volume. Sponsons replaced by external
      cargo handling rigs; no gun batteries. Civilian heraldry along
      the prow — chartered merchant guild iconography, NOT Navy
  map-yacht-roguetrader:
    family: gothic_voidship
    modifier: >-
      Mid-scale gothic voidship configured as a luxury private vessel.
      Length similar to a frigate but with sleeker proportions and
      ornate heraldic flourishes — gilt scrollwork along the prow and
      hull edges, decorative aquila or winged-skull motifs. No gun
      sponsons; replaced by ornamental panel work. Visibly luxurious
      — a Rogue Trader's flagship-yacht

# Hull state — sampled round-robin across each category's archetypes.
hull_states:
  - "pristine, freshly serviced, clean panel work"
  - "lightly weathered, minor scuffing on the hull plating"
  - "weathered with rust streaks and patched panels"
  - "heavily weathered, exposed bracing in places, oil-stained"
  - "battle-damaged, scorched panel patches, torn plating along one flank"
  - "derelict, grime and corrosion across most of the hull, dim interior"

# Lighting — sampled alongside hull state. Phrased as a SHORT modifier
# that follows the lighting_clause from `defaults` ("Interior passively
# lit by unseen lumen strips") so the prompt reads naturally without
# duplication.
lightings:
  - "soft warm illumination, gentle floor wash"
  - "sodium-yellow tone, harsher contrast"
  - "single red emergency lamp glow elsewhere, mostly dark"
  - "cool blue-white naval lighting, sterile cast"
  - "interior mostly dark, only dim rim from pale floor stripes"
  - "warm tungsten glow, candle-like flicker"

# Per-ship-class layouts.
categories:

  - folder: map-freighter-small
    archetypes:
      - "single deck, cockpit at the bow with two-pilot console arrangement, central corridor, mid-ship cargo bay, crew quarters, single rear cargo egress ramp, no other external openings"
      - "single deck, cockpit at the bow, side-corridor leg-room with two crew quarters off it, central engineering, single port-side cargo ramp, no other external openings"
      - "single deck, cockpit at the bow with single-pilot console, mess and bunk room, mid-ship cargo bay with floor cargo-pit, single rear cargo ramp, no other external openings"
      - "single deck, cockpit at the bow, mid-ship medbay with single examination room, central cargo bay, single rear cargo ramp, no other external openings"

  - folder: map-freighter-medium
    archetypes:
      - "single deck, bridge at the bow with three-station console arrangement, central spinal corridor, port-side cargo bay, starboard-side crew quarters, mid-ship engineering bay, single rear cargo egress ramp, no other external openings"
      - "two-deck cross-section presented as adjacent halves: upper deck with bridge and crew quarters, lower deck with engineering and cargo, single rear cargo ramp on the lower deck"
      - "single deck, bridge at the bow, central spinal corridor, mid-ship mess hall, two crew quarters, port-side small medbay, starboard-side cargo bay, single rear cargo ramp"
      - "single deck, bridge at the bow, port-side hangar bay for a single shuttle, starboard-side crew quarters and mess, mid-ship engineering, single rear cargo ramp"

  - folder: map-frigate-escort
    archetypes:
      - "single deck, command bridge at the bow with five-station console arrangement, central spinal corridor running bow-to-stern, lateral broadside gun-battery rooms running along the port and starboard flanks of the midsection (each broadside room contains an empty gun pintle pointing outward to port or starboard, NOT forward), crew bunkroom, engineering at the stern, single rear personnel airlock as the only egress. NO forward-facing turrets or pursuit guns at the bow"
      - "single deck, command bridge at the bow, central spinal corridor, port-side broadside launch tube room for torpedoes (tube oriented out to port, closed loading hatches), starboard-side broadside launch tube room for torpedoes (tube oriented out to starboard), central engineering, single rear personnel airlock. NO forward torpedo tubes or bow ordnance"
      - "single deck, command bridge at the bow, mid-ship sensorium with single console arrangement, lateral broadside small-gun positions along the port and starboard flanks (small empty pintles pointing outward), crew quarters, engineering at the stern, single rear personnel airlock"

  - folder: map-destroyer-light
    archetypes:
      - "single deck, command bridge at the bow with seven-station arrangement, central spinal corridor with armoury and ordnance lockers, lateral broadside gun-battery rooms along the port and starboard flanks (multiple empty gun pintles per side, all pointing outward to port or starboard, NOT forward), mid-ship sensorium, engineering at the stern, single rear personnel airlock. The bow is a heavy armored ram, NO forward turrets"
      - "single deck, command bridge at the bow, mid-ship strategium with central holo-table room, lateral broadside gun-battery rooms running the length of the midsection on port and starboard flanks (broadside guns point outward, not forward), engineering at the stern, single rear personnel airlock"
      - "single deck, command bridge at the bow, central spinal corridor, port-side broadside launch tube room for torpedoes (tube oriented out to port), starboard-side broadside launch tube room for torpedoes (tube oriented out to starboard), engineering at the stern, single rear personnel airlock. NO forward torpedo tubes"

  - folder: map-transport-bulk
    archetypes:
      - "single deck, cockpit at the bow with two-station console, large central cargo hold spanning two thirds of the deck, narrow port-side and starboard-side maintenance corridors, engineering at the stern, single forward cargo ramp at the bow under the cockpit overhang"
      - "single deck, cockpit at the bow, central cargo hold with floor-mounted cargo pits, port-side and starboard-side passenger bunk rooms (empty bunk frames only), engineering at the stern, single rear cargo ramp"
      - "single deck, cockpit at the bow, central cargo hold subdivided into four secured cargo pens (empty pens, just dividers), engineering at the stern, single rear cargo ramp"

  - folder: map-yacht-roguetrader
    archetypes:
      - "single deck, ornate bridge at the bow with throne-station and three console-stations, central spinal corridor, port-side stateroom, starboard-side library/office, mid-ship dining hall, engineering at the stern, single rear personnel ramp"
      - "single deck, ornate bridge at the bow, port-side guest stateroom, starboard-side stateroom for the trader, mid-ship audience hall, engineering at the stern, single rear personnel ramp"
      - "two-deck cross-section presented as adjacent halves: upper deck with bridge and staterooms, lower deck with cargo and crew quarters, single rear personnel ramp on the lower deck"

# ── Cost projection ──────────────────────────────────────────────────
# 6 categories × ~3-4 archetypes = 21 archetypes
# 1 supplement per archetype (default) = 21 generations × $0.04 = $0.84
# Comfortable within the remaining ~$4 envelope.
# To regenerate or expand later, bump --supplements-per-archetype.
