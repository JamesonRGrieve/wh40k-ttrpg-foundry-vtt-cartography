# 40K iconography LoRA — corpus generation manifest (v3 matrix, DRY).
#
# Generates each Imperial symbol across THREE independent axes —
# treatment (material+context), angle, lighting — so the LoRA learns
# to bind the trigger token to the canonical SHAPE, invariant to
# viewing conditions.
#
# Scope: the Imperium of Man and its branches, plus the Imperial
# Aquila itself. Out of scope (deferred): Pariah/Untouchable, Psyker,
# Mutant, Outcast, Chaos. We can add those later as separate LoRA
# packs if needed.
#
# Architecture:
#   - common_treatments  — material+context phrases that apply
#                          uniformly to every symbol (brass on stone,
#                          pendant, banner, etched ferrocrete...).
#   - extra_treatments   — symbol-specific contexts (Mechanicus on a
#                          forge wall, Sororitas on a Rhino hatch,
#                          rogue trader on a Warrant of Trade...).
#   - angles, lighting   — global pools sampled round-robin so every
#                          symbol sees the full angular and lighting
#                          distribution.
#
# Generator (gen_iconography_corpus.py) reads this and for each
# symbol produces  (common_treatments + extra_treatments) × 1 angle
# × 1 lighting  per variant, walking through angles/lighting in
# round-robin so coverage is even.
#
# Reference image conditioning is still applied: the symbol's
# *_isolated.png is fed to Gemini as the canonical-shape anchor.

generator: iconography

defaults:
  # Allow the treatment's mild scene context (the wall, coat, pauldron,
  # banner the symbol is mounted on) but keep the symbol as the
  # dominant focal subject of the frame, full silhouette readable.
  isolation: >-
    single symbol focal subject filling most of the frame,
    full silhouette visible, no text, no caption
  shape_invariance: >-
    preserve the exact heraldic silhouette of the reference image,
    keeping its proportions and internal structure intact

# Treatments shared by every symbol — applied to all 11 entries below.
#
# IMPORTANT: this list is APPEND-ONLY. The generator names output
# files by their sequential index (01, 02, ...). Reordering or
# inserting in the middle would rename every downstream file and
# orphan the existing 162 corpus images.
#
# Treatments 01-11 are the original v1 set (front-on plain renders
# for the material axis). Treatments 12+ are the v3 expansion adding
# the gritty-lived-in 40K vocabulary: stencils, graffiti, mosaic,
# stained glass, friezes, spire doors, tattoos, wax seals,
# serf-scratched ferrocrete, etc.
common_treatments:
  # Original 01-11 (preserved verbatim — do not reorder)
  - "polished brass relief mounted on a dark stone wall"          # 01
  - "weathered brass on dark steel bulkhead"                       # 02
  - "etched into a thick ferrocrete column"                        # 03
  - "stamped pewter lapel pin on a heavy black coat"               # 04
  - "embroidered gold thread on a dark hanging banner"             # 05
  - "engraved silver pendant on a heavy chain"                     # 06
  - "carved oak panel mounted above a doorway"                     # 07
  - "brass emblem mounted on a wall by heavy bolts"                # 08
  - "embossed onto a leather-bound book cover"                     # 09
  - "gilt parchment letterhead at the top of a decree"             # 10
  - "rust-pitted iron foundry casting on a heavy machinery plate"  # 11

  # NOTE: per-symbol `extra_treatments` occupy indices 12-15 below
  # (4 each). The v3 *common* expansion lives at indices 16+ — see
  # `common_treatments_extended` below, which the generator
  # concatenates after the per-symbol extras.

# v3 append-only common expansion. The generator concatenates this
# AFTER the per-symbol `extra_treatments`, so existing extras keep
# their indices 12-15. This block lands at index 16 onward.
common_treatments_extended:
  # Architecture & monumental
  - "embossed onto the heavy bronze doors of an Imperial spire, weathered green patina at the seams"
  - "carved stone frieze running along the facade of a hive cathedral"
  - "mosaic inlaid into a chapel floor of dark and pale stone tiles"
  - "stained glass window in a hive cathedral, casting colored light onto the stone floor"
  # Painted / stenciled / graffiti — the lived-in surfaces
  - "stenciled in white paint on a heavy steel void-ship hull plate, paint runs and overspray"
  - "graffitied in dripping red paint on a manufactorum wall, hand-painted in loyalist devotion"
  - "spray-stenciled in olive drab on a dark green munitions crate"
  - "scratched into ferrocrete by a serf's hand-tool, shallow rough lines"
  # Personal / body
  - "tattooed in black ink on weathered skin of a Guardsman's forearm"
  - "branded into pale skin with a hot iron, raised pink scar tissue"
  # Document and seal
  - "wax seal pressed in red wax on a folded parchment dispatch, ribbon tail"
  - "hand-illuminated in gold leaf on the margin of a manuscript page"
  # Decay and time
  - "moss-covered ancient stone relief on a ruined wall, weathered by centuries"
  - "covered in industrial dust on an abandoned underhive bulkhead, half-obscured"

# Global angle pool — sampled round-robin across each symbol's variants.
angles:
  - "front-on, dead centered, perfectly square to the viewer"
  - "slight three-quarter tilt 15 degrees to the right"
  - "slight three-quarter tilt 15 degrees to the left"
  - "low-angle, viewer looking up at the symbol mounted high"
  - "high-angle, viewer looking down at the symbol on a flat surface"
  - "oblique side angle, 30 degrees off-axis with deep perspective"
  - "near-orthographic with slight downward tilt"
  - "raking side view emphasizing surface relief depth"

# Global lighting pool — sampled round-robin alongside angles.
lighting:
  - "soft top-down lumen-strip lighting, even diffuse"
  - "candlelit warm chiaroscuro from below, deep shadows above"
  - "sodium-yellow industrial side light, harsh oblique shadows"
  - "cold steel-blue rim light, atmospheric fog backdrop"
  - "diffuse overcast grey daylight, no harsh shadows"
  - "single dim red emergency lamp, moody underlighting"
  - "afternoon sun through stained glass, colored light shafts"
  - "torchlit, flickering orange highlights"

symbols:

  - folder: iconography-aquilla
    trigger: sym_aquila
    shape: "Imperial Aquila heraldic two-headed eagle silhouette"
    # v2_shape applies ONLY to v2_extra_treatments below. The
    # step-3000 eval flagged the trained aquila as out-of-proportion
    # (too tall). This shape variant explicitly anchors the
    # canonical WIDE horizontal silhouette so v2 renders bias the
    # learned latent toward correct aspect.
    v2_shape: >-
      Imperial Aquila heraldic two-headed eagle silhouette, WIDE
      horizontal heraldic profile — wingspan is approximately 2.2x
      the body height, wings spread fully horizontal at shoulder
      height OR slightly down-swept in a heraldic stoop, NEVER
      arched up. Two profile heads face outward to port and
      starboard; central body short and broad with talons gripping
      a sunburst at the base. Canonical 40K aquila aspect ratio:
      visibly wider than tall
    extra_treatments:
      - "embossed onto the shoulder pauldron of dark steel power armor"
      - "stamped onto an iron void-ship hull plate"
      - "painted in bone-white enamel on a dark green vehicle hatch"
      - "moss-covered ancient stone relief on a ruined fortress wall"

  - folder: iconography-rosette
    trigger: sym_inq_rosette
    shape: "Inquisitorial I-bar with two-headed eagle and central skull"
    extra_treatments:
      - "polished brass on dark red enamel medallion held in a gloved hand"
      - "stamped iron seal pressed into red wax on a parchment letter"
      - "bone-and-brass signet ring on a black-gloved finger"
      - "dark steel inlay on the cover of a heavy leather grimoire"

  - folder: iconography-mechanicus-cog
    trigger: sym_mech_cog
    shape: "Mechanicus opus, half-cog half-skull, vertical split"
    extra_treatments:
      - "embossed onto the shoulder pauldron of a skitarii praetor"
      - "etched onto a heavy industrial machinery plate"
      - "painted in red and brass on a Mechanicum vehicle armor plate"
      - "engraved copper plate with oxidized green patina, hung above a forge"

  - folder: iconography-skull-winged
    trigger: sym_militarum_winged_skull
    shape: "Astra Militarum winged skull, central skull flanked by spread eagle wings"
    extra_treatments:
      - "embossed onto the shoulder pauldron of Cadian flak armor"
      - "painted in white stencil on dark green tank armor"
      - "stamped pewter pin on a Guardsman's beret on a barracks footlocker"
      - "etched ferrocrete monument plaque to fallen Guardsmen"

  - folder: iconography-fleur-de-lys
    trigger: sym_sororitas_lys
    shape: "Adepta Sororitas fleur-de-lys with skull at center"
    extra_treatments:
      - "polished brass on a black Sororitas power armor pauldron"
      - "embossed onto a Sororitas helm"
      - "painted in white and gold on a Rhino vehicle hatch"
      - "carved ivory inlay on a black wooden convent door"

  - folder: iconography-ministorum-sigil
    trigger: sym_ministorum
    shape: "Adeptus Ministorum sigil, skull within spiked sun circle on capital I-bar"
    extra_treatments:
      - "stained glass window light pattern in a chapel"
      - "painted in red and gold on a chapel column"
      - "carved obsidian pendant on a priest's chain"
      - "stamped pewter pilgrim's badge"

  - folder: iconography-administratum-sigil
    trigger: sym_administratum
    shape: "Adeptus Administratum sigil, capital I-bar with circular central glyph"
    extra_treatments:
      - "embossed wax seal pressed into red wax on a parchment requisition"
      - "stamped pewter signet on an iron filing cabinet drawer"
      - "painted in black ink on a parchment requisition form"
      - "stamped iron foundry mark on an archive door hinge"

  - folder: iconography-arbites-sigil
    trigger: sym_arbites
    shape: "Adeptus Arbites sigil, raised fist within circle flanked by scales of justice on capital I-bar"
    extra_treatments:
      - "embossed onto a riot shield"
      - "painted in white stencil on a black armored Arbites ground car"
      - "stamped pewter regimental badge on a flak-armor coat"
      - "etched into the heavy steel door of a courthouse"

  - folder: iconography-astropath-eye
    trigger: sym_telepathica_eye
    shape: "Adeptus Astra Telepathica sigil, single eye within capital I-bar"
    extra_treatments:
      - "etched silver inlay on a black ceremonial robe collar"
      - "painted in violet and gold on a relay-station wall"
      - "carved obsidian pendant on a chain"
      - "engraved silver, polished, on a chalice on a sanctum altar"

  - folder: iconography-navy-sigil
    trigger: sym_imperial_navy
    shape: "Imperial Navy sigil, winged eagle above central cog on capital I-bar"
    extra_treatments:
      - "stamped pewter on iron void-ship hull plate, riveted"
      - "embossed onto a naval officer's epaulette"
      - "painted in white stencil on a navy-blue void-ship hull"
      - "engraved on a brass nautical compass face"

  - folder: iconography-rogue-trader
    trigger: sym_rogue_trader
    shape: "Rogue Trader insignia, twin-headed eagle above laurel wreath enclosing skull"
    extra_treatments:
      - "carved ivory inlay on a black wooden chest with brass clasps"
      - "gilt parchment Warrant of Trade heading on a heavy parchment scroll"
      - "stamped onto a private void-ship hull plate"
      - "painted in black and gold on a private docking gantry banner"

# ── v2 extension — operator-eval follow-ups ─────────────────────────
#
# Appended AFTER every v1 treatment block so existing PNG filenames
# stay stable on re-run. Indices for v2 entries start at the slot
# immediately after the last v1 treatment for each symbol (varies by
# symbol since per-symbol extra_treatments length varies; treatment
# index 1 is the first common_treatments entry, and v2 lands after
# the last common_treatments_extended entry).
#
# Targets the four diagrammatic triggers (inq_rosette, administratum,
# arbites, imperial_navy) that the 2026-05-08 step-3000 eval marked
# as binding surface treatment correctly but the wrong glyph shape.
# Plus aquila aspect-ratio fixes via the per-symbol `v2_shape:` field
# above.
#
# Cost projection: 6 aquila + 8 each for the four diagrammatic
# triggers = 6 + 32 = 38 new variants × $0.04 = $1.52. Wait for API
# top-up to run.

v2_extra_treatments:

  iconography-aquilla:
    # 6 variants emphasizing wide horizontal posture (operator-flagged
    # "too tall" on step-3000 eval). Treatment text also reinforces
    # the wide spread.
    - "polished brass relief on dark stone, wings spread FULLY HORIZONTAL across the relief field, wingspan dominating the composition"
    - "gold leaf on a wide red ecclesiarchal banner, low-aspect silhouette filling the banner width"
    - "carved sandstone frieze running along a wide horizontal facade, aquila spread along the entire visible width"
    - "stenciled in white paint on a long horizontal void-ship hull plate, wings spread the full length of the plate"
    - "embroidered gold thread on a wide cassock chest panel, wings spread shoulder-to-shoulder"
    - "raised brass relief on a wide chapel altar frontal, wings spread the full width of the altar"

  iconography-rosette:
    # The canonical Inquisitorial rosette is an I-bar with three
    # crossbars. Step-3000 eval rendered a "1"-shaped numeral.
    # Treatments lean on explicit I-bar / crossbar language.
    - "polished brass three-crossbar I-bar with skull-and-eagle medallion at center, on dark red enamel — pure heraldic glyph, not a numeral"
    - "iron-cast Inquisitorial I-bar with three horizontal crossbars and central skull medallion, mounted on a sanctum door"
    - "stamped pewter rosette on a black leather coat — clearly readable as a CAPITAL I with THREE crossbars (top, middle, bottom), each crossbar of equal length"
    - "wax-sealed parchment dispatch with the Inquisitorial rosette pressed in red wax — three-bar I-glyph, not numeral 1"
    - "gold leaf on a black grimoire cover — three-crossbar I-bar with central skull, the bars all equal length"
    - "carved obsidian Inquisitorial rosette pendant — capital I with three horizontal bars, central skull"
    - "white stencil on a dark armored vehicle hatch — three-bar Inquisitorial I rosette"
    - "embossed brass plaque on a holding-cell door — three-crossbar Inquisitorial I-bar with skull center"

  iconography-administratum-sigil:
    # Canonical Administratum sigil is an I-bar with a circular
    # central glyph. Step-3000 eval rendered gibberish text.
    # Treatments emphasize the I-bar + circle structure.
    - "embossed brass on a parchment requisition seal — capital I-bar with a single circular central glyph, no surrounding text"
    - "stamped iron filing-cabinet badge — Administratum I-bar with circular glyph, clean canonical shape, no decorative noise"
    - "painted in black on a Munitorum form letterhead — single I-bar with central circle, nothing else"
    - "carved oak panel above a clerk's desk — Administratum I-bar with central circular glyph"
    - "engraved silver pendant on a chain — Administratum I-bar with central circle, polished, no text"
    - "embossed wax seal on a parchment dispatch — Administratum I-bar with circular center, NO Latin text or runes around it"
    - "stamped pewter pin on a scribe's robe — clean Administratum I-bar with circle"
    - "etched aluminum filing-cabinet tag — single Administratum I-bar with circular center glyph"

  iconography-arbites-sigil:
    # Canonical Arbites sigil is an I-bar with a raised fist in
    # a circle flanked by scales of justice. Step-3000 eval
    # rendered an abstract crown-and-eye-like glyph.
    - "embossed brass on a riot shield — Arbites I-bar with a clenched raised fist in a circle at center, scales of justice flanking left and right"
    - "white stencil on a black armored ground car — Arbites I-bar with raised-fist-in-circle medallion and twin scales-of-justice flanking"
    - "stamped pewter regimental badge on a flak coat — Arbites I-bar, central fist-in-circle, twin scales"
    - "etched on a courthouse heavy steel door — Arbites I-bar with central raised fist in a circle, balanced scales of justice on either side"
    - "carved into a precinct stone lintel — clean Arbites I-bar with raised fist and twin scales, deep relief"
    - "polished brass relief on a courtroom wall plaque — Arbites I-bar, raised fist in central medallion, twin scales of justice flanking"
    - "embossed onto an Arbites cap badge — central fist-in-circle, twin scales, capital I-bar"
    - "stamped on a flak-armor chest plate — Arbites canonical sigil: I-bar + central raised fist + flanking scales"

  iconography-navy-sigil:
    # Canonical Imperial Navy sigil is a winged eagle above a
    # central cog/anchor on an I-bar. Step-3000 eval rendered a
    # generic gear/medallion.
    - "embossed brass on a naval officer's epaulette — Imperial Navy I-bar with a SPREAD-WING EAGLE above a central anchor/cog, clean canonical shape"
    - "stamped pewter on iron void-ship hull plating — Navy I-bar, winged eagle above central anchor, riveted around the perimeter"
    - "painted in white stencil on a navy-blue void-ship hull — Navy I-bar with winged eagle above anchor, clean canonical glyph"
    - "engraved on a brass nautical compass face — Imperial Navy sigil: I-bar + winged eagle + anchor below the eagle, NOT a plain gear"
    - "embossed onto a Navy cap badge — winged eagle above anchor on I-bar"
    - "carved into a void-ship bridge bulkhead — Imperial Navy I-bar with winged eagle and central anchor"
    - "stamped onto a docking-bay floor plate — Navy I-bar with winged eagle above central anchor (not a generic medallion or gear)"
    - "polished brass plaque on an admiralty office wall — Imperial Navy canonical sigil: I-bar with winged eagle and central anchor"
