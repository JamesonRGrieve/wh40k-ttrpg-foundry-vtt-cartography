provenance:
  # Durable license/attribution record. Both sources are CC0 1.0
  # (public domain) — no attribution legally required, but the
  # downloader writes SOURCES.json (file -> {source, assetId, url,
  # license}) so the chain is auditable and supplemental generation
  # knows its seeds. Do NOT delete SOURCES.json.
  ambientcg:  { license: "CC0 1.0", api: "https://ambientcg.com/api/v2/full_json", download: "https://ambientcg.com/get?file=<ID>_1K-JPG.zip (extract *_Color.jpg)" }
  polyhaven:  { license: "CC0 1.0", api: "https://api.polyhaven.com/files/<id>", map: "Diffuse 1k jpg" }
